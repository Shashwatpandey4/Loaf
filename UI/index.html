<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loaf - Meal Planning Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-container">
                    <div class="logo-icon">
                        <img src="loaf.png" alt="Loaf" />
                    </div>
                    <h1 class="logo-text">Loaf</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div id="welcome-screen" class="welcome-screen">
                <div class="welcome-icon">
                    <img src="loaf.png" alt="Loaf" />
                </div>
                <h2 class="greeting">Hello, <span id="user-name">User</span>!</h2>
                <p class="welcome-message">
                    Tell me what you'd like to eat this week, and I'll create a meal plan,
                    order groceries, and schedule everything for you.
                </p>
            </div>

            <!-- Chat Messages Container (hidden initially) -->
            <div id="chat-container" class="chat-container" style="display: none;">
                <div id="chat-messages" class="chat-messages"></div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Describe your ideal meals for the week..."
                autocomplete="off" />
            <button id="send-button" class="send-button" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor" />
                </svg>
            </button>
        </div>

        <!-- Help Button -->
        <button id="help-button" class="help-button" aria-label="Help">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path
                    d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13M12 17H12.01"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
