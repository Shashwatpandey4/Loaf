<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <div class="bot-message">👋 Hi! I'm your assistant. Type "buy" to proceed to payment.</div>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      userInput.value = '';

      if (message.toLowerCase().includes('buy')) {
        addMessage('Redirecting you to secure payment...', 'bot');

        // Wait a moment for the user to read message
        setTimeout(async () => {
          try {
            const response = await fetch('/go-to-payment', { method: 'POST' });
            const data = await response.json();
            if (data.url) {
              // Redirect user to Stripe Checkout
              window.location.href = data.url;
            } else {
              addMessage('⚠️ Error creating payment session.', 'bot');
            }
          } catch (error) {
            console.error('Error:', error);
            addMessage('⚠️ Failed to connect to payment server.', 'bot');
          }
        }, 1000);
      } else {
        addMessage("I didn’t understand that. Try typing 'buy' to continue.", 'bot');
      }
    });

    // Utility function to show chat messages
    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'user-message' : 'bot-message';
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
